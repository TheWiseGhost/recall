[alembic]
script_location = packages/recall/storage/postgres/migrations
prepend_sys_path = packages
path_separator = os

# The URL is supplied by env.py from Recall's own configuration so that
# `recall.yaml`, DATABASE_URL and RECALL_DATABASE__URL all keep working.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
