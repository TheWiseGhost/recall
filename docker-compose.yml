# Milestone 1 brings up PostgreSQL with pgvector, which is everything the CLI
# needs. Redis, the API, the worker, the frontend, Prometheus and Grafana are
# added in Milestones 3 and 4 (see README roadmap).

name: recall

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: recall-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall}
      POSTGRES_DB: ${POSTGRES_DB:-recall}
      # The corpus lives on disk, not in shared buffers; give sorting room
      # instead, which is what vector distance ordering actually uses.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recall} -d ${POSTGRES_DB:-recall}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
