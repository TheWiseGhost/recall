name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A failing test case is the fastest possible bug report.
      placeholder: |
        1. recall init --embedding-provider hash
        2. recall migrate
        3. recall ingest ./docs
        4. ...
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of `recall status`
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Relevant part of recall.yaml
      description: Remove any credentials first.
      render: yaml

  - type: input
    id: version
    attributes:
      label: Recall version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.13"
