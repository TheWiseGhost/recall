# Experiment 002 — Is hybrid retrieval worth the complexity?
#
#   recall ingest <your corpus>
#   recall experiment ./experiments/configs/002-bm25-vs-dense-vs-hybrid.yaml
#
# The dataset below does not ship with Recall — point `dataset.path` at your own
# labelled queries. `experiments/datasets/example_tiny.jsonl` will run, but ten
# synthetic queries over four documents cannot support any conclusion.

name: bm25-vs-dense-vs-hybrid

hypothesis: >
  Hybrid retrieval fusing dense and lexical scores will beat either alone on
  technical documentation, because exact identifier matches (function names,
  error codes) are lexical signal that embeddings blur.

dataset:
  path: ./experiments/datasets/technical_docs.jsonl

# Not sweep axes — layered over your recall.yaml for every run. Sweeping these
# would require re-ingesting the corpus per point; see docs/experiments/index.md.
chunking:
  strategy: fixed
  chunk_size: 512
  overlap: 64

embedding:
  provider: sentence_transformers
  model: BAAI/bge-base-en-v1.5

retrieval:
  strategies:
    - bm25
    - dense
    - hybrid

hybrid:
  dense_weight: 0.65
  lexical_weight: 0.35
  # rrf ignores component scores and fuses on rank alone: BM25 scores and cosine
  # similarities are not on a comparable scale.
  fusion: rrf

top_k: [5, 10, 20]

metrics:
  - precision_at_k
  - recall_at_k
  - hit_rate_at_k
  - mrr
  - ndcg_at_k
